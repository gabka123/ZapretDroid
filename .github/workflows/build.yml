
name: Build ZapretDroid APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip ZapretDroid_maintenance_build.zip

      - name: Build APK
        working-directory: ZapretDroid-main
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZapretDroid-debug
          path: ZapretDroid-main/app/build/outputs/apk/debug/app-debug.apk
          
